name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: 形式化一致性检验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 V0.1 检验
        run: python verification/可能性引擎_形式化一致性检验_V0.1.py

      - name: 运行 V0.2 检验
        run: python verification/可能性引擎_形式化一致性检验_V0.2.py
